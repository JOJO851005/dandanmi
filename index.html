<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蛋蛋咪的小世界</title>

  <!-- 可爱字体 -->
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #ffdce5;
      --cream: #fff8fb;
      --accent: #ff7fa3;
      --text: #666;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "ZCOOL KuaiLe", sans-serif;
    }

    body {
      background: var(--cream);
      color: var(--text);
    }

    header {
      background: var(--pink);
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    header h1 {
      color: var(--accent);
      font-size: 24px;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      margin: 0 8px;
      text-decoration: none;
      color: #777;
      font-size: 14px;
    }

    section {
      padding: 20px;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(10px);} 
      to {opacity:1; transform: translateY(0);} 
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .hero img {
      width: 100%;
      border-radius: 20px;
      transition: transform 0.3s;
    }

    .hero img:hover {
      transform: scale(1.03);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }

    .gallery img {
      width: 100%;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* 图片放大 */
    .preview {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99;
    }

    .preview img {
      max-width: 90%;
      border-radius: 20px;
    }

    /* 底部导航（手机像APP） */
    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
    }

    .tabbar a {
      text-decoration: none;
      color: var(--accent);
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 40px 10px 80px;
      color: #aaa;
    }
  </style>
</head>
<body>

<header>
  <h1>🐾 蛋蛋咪的小世界</h1>
  <nav>
    <a href="#home">首页</a>
    <a href="#gallery">相册</a>
    <a href="#diary">日记</a>
    <a href="#about">关于</a>
  </nav>
</header>

<section id="home">
  <div class="card hero">
    <h2>欢迎来到蛋蛋咪 💗</h2>
    <p>一只软萌三花小猫的治愈日常</p>
    <img src="cat1.jpg" />
  </div>
</section>

<section id="gallery">
  <h2>📸 猫咪相册</h2>
  <div class="gallery">
    <img src="cat1.jpg" onclick="preview(this.src)">
    <img src="cat2.jpg" onclick="preview(this.src)">
    <img src="cat3.jpg" onclick="preview(this.src)">
    <img src="cat4.jpg" onclick="preview(this.src)">
  </div>
</section>

<section id="diary">
  <h2>📖 今日猫猫日记</h2>
  <div class="card">
    <h3 id="date"></h3>
    <p id="diaryText"></p>
  </div>
</section>

<section id="about">
  <h2>🐱 蛋蛋咪档案</h2>
  <div class="card">
    <p><strong>名字：</strong> 蛋蛋咪</p>
    <p><strong>性格：</strong> 软萌 + 好奇 + 爱撒娇</p>
    <p><strong>技能：</strong> 无敌卖萌 / 抓玩具 / 盯窗外</p>
    <p><strong>特点：</strong> 三花猫，颜值天花板 ✨</p>
  </div>
</section>

<div class="preview" onclick="this.style.display='none'">
  <img id="previewImg">
</div>

<footer>
  <p>© 蛋蛋咪 · 被可爱统治的世界</p>
</footer>

<!-- 底部tab -->
<div class="tabbar">
  <a href="#home">🏠 首页</a>
  <a href="#gallery">📸 相册</a>
  <a href="#diary">📖 日记</a>
  <a href="#about">🐱 我</a>
</div>

<script>
// 图片放大
function preview(src) {
  document.querySelector('.preview').style.display = 'flex';
  document.getElementById('previewImg').src = src;
}

// 自动日记（随机）
const texts = [
  "今天蛋蛋咪在窗边发呆，超级温柔～",
  "抓到了逗猫棒，感觉自己是猎手！",
  "又睡了一整天，猫生好幸福",
  "盯着外面的鸟看了好久，好认真！",
  "突然冲刺，然后什么都没发生 😂"
];

const today = new Date();

document.getElementById('date').innerText = today.toLocaleDateString();

document.getElementById('diaryText').innerText = texts[Math.floor(Math.random()*texts.length)];
</script>

<!-- 背景音乐 -->
<audio id="bgm" src="music.mp3" loop></audio>

<script>
// 图片放大
function preview(src) {
  document.querySelector('.preview').style.display = 'flex';
  document.getElementById('previewImg').src = src;
}

// 自动日记
const texts = [
  "今天蛋蛋咪在窗边发呆，超级温柔～",
  "抓到了逗猫棒，感觉自己是猎手！",
  "又睡了一整天，猫生好幸福",
  "盯着外面的鸟看了好久，好认真！",
  "突然冲刺，然后什么都没发生 😂"
];

const today = new Date();
document.getElementById('date').innerText = today.toLocaleDateString();
document.getElementById('diaryText').innerText = texts[Math.floor(Math.random()*texts.length)];

// 点击猫猫互动
const cats = document.querySelectorAll('img');
cats.forEach(cat => {
  cat.addEventListener('click', () => {
    const heart = document.createElement('div');
    heart.innerText = '💗';
    heart.style.position = 'fixed';
    heart.style.left = event.clientX + 'px';
    heart.style.top = event.clientY + 'px';
    heart.style.fontSize = '24px';
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 800);

    // 喵声
    const meow = new Audio('meow.mp3');
    meow.play();
  });
});

// 自动播放音乐（需要用户点击一次页面触发）
document.body.addEventListener('click', () => {
  document.getElementById('bgm').play();
}, { once: true });
</script>

</body>
</html>
